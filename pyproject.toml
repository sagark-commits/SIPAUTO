[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sipauto"
version = "0.1.0"
description = "Interactive on-prem SIP trunk automation for Ameyo/Asterisk/FreePBX (Tata, Jio, Airtel, Vodafone-Idea). Zero runtime pip deps — stdlib + OpenSSH."
readme = "README.md"
requires-python = ">=3.10"
# Runtime: Python stdlib + system OpenSSH (`ssh`/`scp`). Optional sshpass for password auth.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Legacy extras kept for environments that still want the old rich UI stack (unused by default).
full = []

[project.scripts]
sipauto = "sipauto.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
